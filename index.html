<!DOCTYPE html>
<html>
<head>
  <title>Multimedia Embedding</title>
  <link rel="stylesheet" href="index.css">
</head>
<body>

  <h1>Multimedia Embedding — Video with Captions</h1>

  <div class="videostyle">
    <video id="myVideo" controls width="700">
      <source src="video2.mp4" type="video/mp4">
      <track
      src="captions.vtt"
        label="English"
        kind="captions"
        srclang="en"
        default>
    </video>
  </div>

</body>
</html>
